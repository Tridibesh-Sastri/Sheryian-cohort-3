<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="media/favicon.ico" type="image/x-icon">
    <meta name="description" content="This is a sample webpage to demonstrate the use of HTML and CSS. It includes a navigation bar, a main content area, and a clock. The design is responsive and adapts to different screen sizes.">
    <meta>
</head>
<body>
    <div class="main">
        <nav>
            <div id="logo">My Logo</div>
            <div class="links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
                <!-- <div class="grnd_son">
                    <p>child 1</p>
                    <p>child 2</p>
                    <p>child 3</p>
                </div> -->
            </div>
            <div class="action_btn">
                <button>Get Started</button>
                <button>Cart</button>
                <button>Sign In</button>
            </div>
        </nav>
        <div class="top_text">
            <h1>Where The <br>Style Emerge</h1>
        </div>
        <div class="container">
            <div class="col" >
                <div id="col1">1</div>
            </div>
            <div class="col">
                <div class="small">2</div>
                <div class="big">3</div>
            </div>
            <div class="col">
                <div id="col3">
                    4
                </div>
            </div>
            <div class="col">
                <div class="big">5</div>
                <div class="small">6</div>
            </div>
            <div class="col">
                <div id="col5">7</div>
            </div>
        </div>
        <div class=" clock">
            <div class="circle">
                <div class="hand minute"></div>
                <div class="hand second"></div>
            </div>
        </div>
    </div>
    <div class="box">
        <div class="innerbox"></div>
        <div class="innerbox"></div>
        <div class="innerbox"></div>
    </div>
</body>
</html>
